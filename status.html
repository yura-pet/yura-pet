<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f1f4">
<meta name="robots" content="noindex">
<title>Yura｜查詢預約</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main class="wrap">
  <section class="card">
    <h1 class="section-title">查詢預約進度</h1>
    <p>輸入送出預約時拿到的 8 碼預約編號。</p>
    <form id="f" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px">
      <input type="text" id="code" placeholder="例：AB12-CD34" style="flex:1;min-width:200px;text-transform:uppercase;letter-spacing:.08em" autocomplete="off">
      <button class="btn primary" type="submit">查詢</button>
    </form>
    <div id="out"></div>
  </section>
</main>
<script type="module">
import { chrome, esc, lineHref } from "./assets/js/common.js";
import { STATUS, money } from "./assets/js/services.js";
import { getBooking, getSettings, fmtCode, normCode } from "./assets/js/db.js";
chrome("status");
const out = document.getElementById("out"), input = document.getElementById("code");
const ORDER = ["new", "confirmed", "paid", "done"];
let settings;

async function show(code) {
  out.innerHTML = `<p class="muted" style="margin-top:16px">查詢中…</p>`;
  settings ||= await getSettings();
  const b = await getBooking(code);
  if (!b) { out.innerHTML = `<div class="note warn">找不到這個預約編號，請確認是否輸入正確。若有疑問請到 LINE 詢問。</div>`; return; }
  const st = STATUS[b.status] || STATUS.new;
  const idx = ORDER.indexOf(b.status);
  const h = lineHref(settings);
  out.innerHTML = `
    <div class="summary" style="margin-top:18px">
      <div class="row"><div class="k">預約編號</div><div class="v"><b>${esc(fmtCode(b.id))}</b></div></div>
      <div class="row"><div class="k">目前狀態</div><div class="v"><span class="badge ${st.tone}">${esc(st.label)}</span></div></div>
      <div class="row"><div class="k">服務</div><div class="v">${esc(b.serviceName || "")}｜${esc(b.planLabel || "")}</div></div>
      <div class="row"><div class="k">毛孩</div><div class="v">${esc(b.petName)}</div></div>
      <div class="row"><div class="k">${b.confirmedTime ? "確認時間" : "希望時段"}</div><div class="v">${esc(b.confirmedTime || [...(b.slotLabels || []), b.customTimes].filter(Boolean).join("\n") || "等待安排")}</div></div>
      <div class="row total"><div class="k">金額</div><div class="v">${money(b.finalPrice || b.total)}</div></div>
    </div>
    <p style="margin-top:14px">${esc(st.desc)}</p>
    ${b.status === "confirmed" ? `<div class="note warn"><b>付款資訊</b><br>${esc(settings.paymentInfo).replace(/\n/g, "<br>")}</div>` : ""}
    ${b.publicNote ? `<div class="note"><b>Yura 的備註</b><br>${esc(b.publicNote).replace(/\n/g, "<br>")}</div>` : ""}
    ${b.status !== "cancelled" ? `<div class="timeline">${[["new", "已送出預約", "回 LINE 告訴我編號並傳照片"], ["confirmed", "確認時段", "我會保留時間並通知付款"], ["paid", "完成付款・預約成功", "時段正式保留 ✨"], ["done", "服務完成", ""]]
      .map(([k, t, d], i) => `<div class="tl ${i <= idx ? "on" : ""} ${i === idx ? "now" : ""}"><div><b>${t}</b>${d ? `<br><span class="muted">${d}</span>` : ""}</div></div>`).join("")}</div>` : ""}
    ${h ? `<div class="row-btns"><a class="btn line" href="${h}" target="_blank" rel="noopener">到 LINE 聯絡 Yura</a></div>` : ""}`;
}
document.getElementById("f").onsubmit = e => {
  e.preventDefault();
  const c = normCode(input.value);
  history.replaceState(null, "", "?id=" + c);
  show(c);
};
const q = new URLSearchParams(location.search).get("id");
if (q) { input.value = fmtCode(normCode(q)); show(q); }
</script>
</body>
</html>
