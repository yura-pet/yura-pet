# Netlify 部署設定：只部署 manager 資料夾（個人預約管理系統）
[build]
  base = "manager"
  publish = "."
  functions = "netlify/functions"
  # 客人網站的檔案在 manager 外面，所以每次推送都要重新部署（不要因為 manager 沒改就跳過）
  ignore = "exit 1"
  # 把客人用的預約網站複製到 /site/，方便在同一個網址預覽
  command = "rm -rf site && mkdir site && cp -r ../*.html ../assets ../images ../ChenYuluoyan.woff2 ../Iansui.woff2 ../yura-background.jpg site/"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
